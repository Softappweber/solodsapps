<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>soloDS Calendar</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /* --- 10 THEMES --- */
  :root {
    --bg: #0f172a; --surface: rgba(30, 41, 59, 0.8); --primary: #6366f1; --text-main: #f8fafc; --text-muted: #94a3b8; --border: rgba(255, 255, 255, 0.1); --shadow: 0 10px 30px rgba(0, 0, 0, 0.3); --accent: #f59e0b;
  }
  [data-theme="saffron"] { --bg: #fff7ed; --surface: #ffffff; --primary: #ea580c; --text-main: #431407; --text-muted: #9a3412; --border: #ffedd5; --shadow: 0 10px 30px rgba(234, 88, 12, 0.15); }
  [data-theme="forest"] { --bg: #f0fdf4; --surface: #ffffff; --primary: #16a34a; --text-main: #052e16; --text-muted: #166534; --border: #dcfce7; --shadow: 0 10px 30px rgba(22, 163, 74, 0.15); }
  [data-theme="ocean"] { --bg: #f0f9ff; --surface: #ffffff; --primary: #0284c7; --text-main: #082f49; --text-muted: #0369a1; --border: #e0f2fe; --shadow: 0 10px 30px rgba(2, 132, 199, 0.15); }
  [data-theme="rose"] { --bg: #fff1f2; --surface: #ffffff; --primary: #e11d48; --text-main: #4c0519; --text-muted: #be123c; --border: #ffe4e6; --shadow: 0 10px 30px rgba(225, 29, 72, 0.15); }
  [data-theme="cyberpunk"] { --bg: #000000; --surface: #111111; --primary: #facc15; --text-main: #ffffff; --text-muted: #a1a1aa; --border: #27272a; --shadow: 0 0 20px rgba(250, 204, 21, 0.2); --accent: #06b6d4; }
  [data-theme="gold"] { --bg: #18181b; --surface: #27272a; --primary: #eab308; --text-main: #fef08a; --text-muted: #a16207; --border: #3f3f46; --shadow: 0 10px 30px rgba(234, 179, 8, 0.1); }
  [data-theme="lavender"] { --bg: #faf5ff; --surface: #ffffff; --primary: #9333ea; --text-main: #3b0764; --text-muted: #7e22ce; --border: #f3e8ff; --shadow: 0 10px 30px rgba(147, 51, 234, 0.15); }
  [data-theme="slate"] { --bg: #f1f5f9; --surface: #ffffff; --primary: #334155; --text-main: #0f172a; --text-muted: #64748b; --border: #e2e8f0; --shadow: 0 10px 30px rgba(51, 65, 85, 0.1); }
  [data-theme="crimson"] { --bg: #450a0a; --surface: rgba(69, 10, 10, 0.8); --primary: #ef4444; --text-main: #fef2f2; --text-muted: #fca5a5; --border: rgba(239, 68, 68, 0.2); --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background-color: var(--bg); color: var(--text-main); height: 100vh; display: flex; flex-direction: column; overflow: hidden; transition: background 0.4s; }

  /* --- HEADER --- */
  .header { padding: 20px 20px 10px; display: flex; justify-content: space-between; align-items: center; }
  .header-title { font-size: 1.5rem; font-weight: 800; letter-spacing: -0.5px; }
  .theme-btn { background: var(--surface); border: 1px solid var(--border); color: var(--text-main); padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; font-weight: 700; cursor: pointer; box-shadow: var(--shadow); transition: 0.2s; }
  .theme-btn:active { transform: scale(0.95); }

  /* --- CALENDAR SECTION --- */
  .calendar-wrap { padding: 0 20px; transition: transform 0.2s; touch-action: pan-y; }
  .cal-header { display: flex; justify-content: space-between; align-items: center; margin: 10px 0 15px; }
  .cal-month { font-size: 1.2rem; font-weight: 800; }
  .cal-nav { display: flex; gap: 10px; }
  .cal-btn { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border); color: var(--text-main); display: flex; justify-content: center; align-items: center; font-weight: bold; cursor: pointer; box-shadow: var(--shadow); }
  
  .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-size: 0.75rem; font-weight: 800; color: var(--text-muted); margin-bottom: 10px; }
  .weekdays div:first-child { color: #ef4444; }
  
  .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
  .day { 
    aspect-ratio: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; 
    border-radius: 14px; font-size: 1rem; font-weight: 700; position: relative; cursor: pointer; transition: all 0.2s;
    background: var(--surface); border: 1px solid var(--border); box-shadow: var(--shadow);
  }
  .day.empty { visibility: hidden; }
  .day.today { border: 2px solid var(--primary); color: var(--primary); }
  .day.selected { background: var(--primary); color: #fff; box-shadow: 0 5px 15px rgba(0,0,0,0.2); transform: scale(1.05); }
  .day.holiday::after { content: ''; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; position: absolute; bottom: 6px; }
  .day.selected.holiday::after { background: #fff; }

  /* --- BOTTOM INFO SECTION --- */
  .bottom-info { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px; text-align: center; }
  
  .live-clock { font-size: 4rem; font-weight: 800; letter-spacing: -2px; line-height: 1; margin-bottom: 5px; color: var(--primary); font-variant-numeric: tabular-nums; }
  .live-clock span { font-size: 1.5rem; color: var(--text-muted); font-weight: 700; }
  .live-date { font-size: 1.1rem; font-weight: 700; color: var(--text-main); margin-bottom: 30px; }
  
  /* --- BRIAN TRACY QUOTE --- */
  .quote-box { max-width: 90%; background: var(--surface); padding: 20px; border-radius: 20px; border: 1px solid var(--border); box-shadow: var(--shadow); position: relative; }
  .quote-box::before { content: '“'; position: absolute; top: -10px; left: 10px; font-size: 3rem; color: var(--primary); opacity: 0.3; font-family: serif; }
  .quote-text { font-size: 0.95rem; font-style: italic; font-weight: 500; line-height: 1.4; color: var(--text-main); margin-bottom: 10px; z-index: 1; position: relative; }
  .quote-author { font-size: 0.8rem; font-weight: 800; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

  /* --- MODALS (THEMES & INFO) --- */
  .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); backdrop-filter: blur(5px); z-index: 100; display: none; justify-content: center; align-items: flex-end; opacity: 0; transition: opacity 0.3s; }
  .modal-overlay.active { display: flex; opacity: 1; }
  
  .modal-content { background: var(--bg); width: 100%; max-height: 80vh; border-radius: 30px 30px 0 0; padding: 25px; box-shadow: 0 -10px 40px rgba(0,0,0,0.3); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; border-top: 1px solid var(--border); }
  .modal-overlay.active .modal-content { transform: translateY(0); }
  .drag-handle { width: 40px; height: 5px; background: var(--text-muted); border-radius: 3px; margin: 0 auto 20px; opacity: 0.3; cursor: pointer; }
  
  .modal-title { font-size: 1.2rem; font-weight: 800; margin-bottom: 20px; color: var(--text-main); }

  /* Theme Grid */
  .theme-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .theme-item { padding: 15px; border-radius: 12px; border: 2px solid var(--border); background: var(--surface); font-weight: 700; text-align: center; cursor: pointer; transition: 0.2s; }
  .theme-item:active { transform: scale(0.95); }
  .theme-item.active { border-color: var(--primary); color: var(--primary); }

  /* Holiday Info */
  .holiday-card { background: var(--surface); border-left: 4px solid var(--accent); padding: 15px; border-radius: 0 12px 12px 0; margin-bottom: 10px; display: flex; align-items: center; gap: 15px; }
  .holiday-emoji { font-size: 2rem; }
  .holiday-text h4 { font-size: 1.1rem; font-weight: 800; color: var(--text-main); }
  .holiday-text p { font-size: 0.85rem; color: var(--text-muted); margin-top: 4px; font-weight: 500; }
</style>
</head>
<body data-theme="saffron">

  <div class="header">
    <div class="header-title">soloDS Calendar</div>
    <button class="theme-btn" onclick="openThemeModal()">🎨 Theme</button>
  </div>

  <!-- Swipeable Calendar -->
  <div class="calendar-wrap" id="calendarWrap">
    <div class="cal-header">
      <div class="cal-month" id="cal-month-year">Month Year</div>
      <div class="cal-nav">
        <div class="cal-btn" onclick="changeMonth(-1)">‹</div>
        <div class="cal-btn" onclick="changeMonth(1)">›</div>
      </div>
    </div>
    <div class="weekdays">
      <div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div>
    </div>
    <div class="days-grid" id="days-grid"></div>
  </div>

  <!-- Big Clock & Quote -->
  <div class="bottom-info">
    <div class="live-clock" id="liveClock">00:00<span>00</span></div>
    <div class="live-date" id="liveDate">Loading Date...</div>
    
    <div class="quote-box">
      <div class="quote-text" id="quoteText">Your life only gets better when you get better.</div>
      <div class="quote-author">— Brian Tracy</div>
    </div>
  </div>

  <!-- MODAL 1: THEMES -->
  <div class="modal-overlay" id="themeModal" onclick="closeThemeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="drag-handle" onclick="closeThemeModal()"></div>
      <div class="modal-title">Select a Theme</div>
      <div class="theme-grid" id="themeGrid">
        <!-- Themes injected via JS -->
      </div>
    </div>
  </div>

  <!-- MODAL 2: DATE INFO -->
  <div class="modal-overlay" id="infoModal" onclick="closeInfoModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
      <div class="drag-handle" onclick="closeInfoModal()"></div>
      <div class="modal-title" id="infoDateTitle">Date Details</div>
      <div id="infoContent"></div>
    </div>
  </div>

<script>
  // --- DATA ---
  const holidays = [
    { date: '2026-01-01', title: 'New Year', type: 'Global', emoji: '🎆', desc: 'English New Year' },
    { date: '2026-01-14', title: 'Makar Sankranti', type: 'Hindu', emoji: '🪁', desc: 'Harvest festival' },
    { date: '2026-01-26', title: 'Republic Day', type: 'National', emoji: '🇮🇳', desc: 'Constitution of India' },
    { date: '2026-03-03', title: 'Holi', type: 'Hindu', emoji: '🎨', desc: 'Festival of Colors' },
    { date: '2026-03-21', title: 'Eid-ul-Fitr', type: 'Muslim', emoji: '🌙', desc: 'End of Ramadan' },
    { date: '2026-04-14', title: 'Ambedkar Jayanti', type: 'National', emoji: '⚖️', desc: 'Birth of Dr. B.R. Ambedkar' },
    { date: '2026-08-15', title: 'Independence Day', type: 'National', emoji: '🇮🇳', desc: 'Freedom from British rule' },
    { date: '2026-08-28', title: 'Raksha Bandhan', type: 'Hindu', emoji: '🪢', desc: 'Bond of protection' },
    { date: '2026-09-05', title: 'Krishna Janmashtami', type: 'Hindu', emoji: '🦚', desc: 'Birth of Lord Krishna' },
    { date: '2026-10-02', title: 'Gandhi Jayanti', type: 'National', emoji: '👓', desc: 'Birth of Mahatma Gandhi' },
    { date: '2026-10-20', title: 'Dussehra', type: 'Hindu', emoji: '🏹', desc: 'Victory of Lord Rama' },
    { date: '2026-11-08', title: 'Diwali', type: 'Hindu', emoji: '🪔', desc: 'Festival of Lights' },
    { date: '2026-11-10', title: 'Bhai Dooj', type: 'Hindu', emoji: '🤝', desc: 'Brother-Sister bond' },
    { date: '2026-11-24', title: 'Guru Nanak Jayanti', type: 'Sikh', emoji: '🛕', desc: 'Birth of Guru Nanak' },
    { date: '2026-12-25', title: 'Christmas', type: 'Christian', emoji: '🎄', desc: 'Birth of Jesus Christ' }
  ];

  const quotes = [
    "Your life only gets better when you get better.",
    "The only limit to our realization of tomorrow will be our doubts of today.",
    "Success is the sum of small efforts, repeated day in and day out.",
    "You cannot control what happens to you, but you can control your attitude.",
    "Develop an attitude of gratitude, and give thanks for everything.",
    "The more you seek security, the less of it you have. The more you seek opportunity, the more likely it is that you will achieve the security that you desire.",
    "All successful people are big dreamers. They imagine what their future could be, ideal in every respect, and then they work every day toward their distant vision, that goal or purpose."
  ];

  const themes = ['midnight', 'saffron', 'forest', 'ocean', 'rose', 'cyberpunk', 'gold', 'lavender', 'slate', 'crimson'];
  const themeNames = ['Midnight', 'Saffron', 'Forest', 'Ocean', 'Rose', 'Cyberpunk', 'Gold', 'Lavender', 'Slate', 'Crimson'];

  // --- STATE ---
  const today = new Date();
  let currentMonth = today.getMonth();
  let currentYear = today.getFullYear();

  // --- THEME ENGINE ---
  function buildThemeGrid() {
    const grid = document.getElementById('themeGrid');
    grid.innerHTML = '';
    themes.forEach((t, i) => {
      let isActive = document.body.getAttribute('data-theme') === t;
      grid.innerHTML += `<div class="theme-item ${isActive ? 'active' : ''}" onclick="setTheme('${t}', this)">${themeNames[i]}</div>`;
    });
  }

  function setTheme(theme, el) {
    document.body.setAttribute('data-theme', theme);
    document.querySelectorAll('.theme-item').forEach(item => item.classList.remove('active'));
    el.classList.add('active');
    closeThemeModal();
  }

  function openThemeModal() { 
    buildThemeGrid();
    document.getElementById('themeModal').classList.add('active'); 
  }
  function closeThemeModal(e) {
    if (!e || e.target.id === 'themeModal' || e.target.classList.contains('drag-handle')) {
      document.getElementById('themeModal').classList.remove('active');
    }
  }

  // --- INFO MODAL ENGINE ---
  function openInfoModal(dayNum, dateStr) {
    let cellDate = new Date(currentYear, currentMonth, dayNum);
    let displayDate = cellDate.toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    
    document.getElementById('infoDateTitle').innerText = displayDate;
    let holiday = holidays.find(h => h.date === dateStr);
    let content = document.getElementById('infoContent');
    
    if (holiday) {
      content.innerHTML = `
        <div class="holiday-card">
          <div class="holiday-emoji">${holiday.emoji}</div>
          <div class="holiday-text">
            <h4>${holiday.title}</h4>
            <p>${holiday.type} • ${holiday.desc}</p>
          </div>
        </div>
      `;
    } else {
      content.innerHTML = `<div style="text-align:center; padding: 20px; color: var(--text-muted); font-weight: 500;">No major holidays on this day.</div>`;
    }
    document.getElementById('infoModal').classList.add('active');
  }

  function closeInfoModal(e) {
    if (!e || e.target.id === 'infoModal' || e.target.classList.contains('drag-handle')) {
      document.getElementById('infoModal').classList.remove('active');
    }
  }

  // --- CALENDAR ENGINE ---
  function formatDateToStr(d) {
    let month = '' + (d.getMonth() + 1);
    let day = '' + d.getDate();
    let year = d.getFullYear();
    if (month.length < 2) month = '0' + month;
    if (day.length < 2) day = '0' + day;
    return [year, month, day].join('-');
  }

  function renderCalendar() {
    const monthNames = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
    document.getElementById('cal-month-year').innerText = `${monthNames[currentMonth]} ${currentYear}`;
    
    const grid = document.getElementById('days-grid');
    grid.innerHTML = '';
    
    const firstDay = new Date(currentYear, currentMonth, 1).getDay();
    const daysInMonth = new Date(currentYear, currentMonth + 1, 0).getDate();
    
    for (let i = 0; i < firstDay; i++) {
      grid.innerHTML += `<div class="day empty"></div>`;
    }
    
    for (let i = 1; i <= daysInMonth; i++) {
      let cellDate = new Date(currentYear, currentMonth, i);
      let dateStr = formatDateToStr(cellDate);
      
      let classes = 'day';
      if (i === today.getDate() && currentMonth === today.getMonth() && currentYear === today.getFullYear()) classes += ' today';
      if (holidays.find(h => h.date === dateStr)) classes += ' holiday';
      
      grid.innerHTML += `<div class="${classes}" onclick="openInfoModal(${i}, '${dateStr}')">${i}</div>`;
    }
  }

  function changeMonth(dir) {
    currentMonth += dir;
    if (currentMonth < 0) { currentMonth = 11; currentYear--; }
    if (currentMonth > 11) { currentMonth = 0; currentYear++; }
    renderCalendar();
  }

  // --- SWIPE ENGINE ---
  let touchStartX = 0;
  let touchEndX = 0;
  const wrap = document.getElementById('calendarWrap');

  wrap.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  }, { passive: true });

  wrap.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    handleSwipe();
  }, { passive: true });

  function handleSwipe() {
    const swipeThreshold = 50;
    if (touchEndX < touchStartX - swipeThreshold) {
      changeMonth(1); // Swipe Left -> Next Month
    }
    if (touchEndX > touchStartX + swipeThreshold) {
      changeMonth(-1); // Swipe Right -> Prev Month
    }
  }

  // --- LIVE CLOCK & DATE ---
  function updateClock() {
    const now = new Date();
    let h = now.getHours();
    let m = now.getMinutes();
    let s = now.getSeconds();
    
    h = h % 12 || 12;
    m = m < 10 ? '0' + m : m;
    s = s < 10 ? '0' + s : s;
    
    document.getElementById('liveClock').innerHTML = `${h}:${m}<span>${s}</span>`;
    
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    document.getElementById('liveDate').innerText = now.toLocaleDateString('en-IN', options);
  }
  setInterval(updateClock, 1000);
  updateClock();

  // --- QUOTE ENGINE ---
  function loadRandomQuote() {
    const randomIndex = Math.floor(Math.random() * quotes.length);
    document.getElementById('quoteText').innerText = quotes[randomIndex];
  }

  // --- INIT ---
  renderCalendar();
  loadRandomQuote();

</script>
</body>
</html>
