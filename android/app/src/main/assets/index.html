<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Voice Tasks & Reminders</title>
<style>
  :root { --bg: #0f172a; --card: rgba(30, 41, 59, 0.7); --primary: #38bdf8; --text: #f8fafc; --text-muted: #94a3b8; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
  body { background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  
  /* Header & Calendar */
  .header { padding: 20px 20px 10px; background: linear-gradient(180deg, #1e293b 0%, var(--bg) 100%); }
  h1 { font-size: 1.5rem; margin-bottom: 15px; font-weight: 700; }
  
  .date-strip { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; scrollbar-width: none; }
  .date-strip::-webkit-scrollbar { display: none; }
  .date-btn { background: var(--card); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 10px 15px; border-radius: 12px; text-align: center; min-width: 65px; cursor: pointer; }
  .date-btn.active { background: var(--primary); color: #000; border-color: var(--primary); font-weight: bold; }
  .date-btn .day { font-size: 0.75rem; text-transform: uppercase; }
  .date-btn .num { font-size: 1.2rem; font-weight: bold; margin-top: 2px; }

  /* Task List */
  .task-list { flex: 1; overflow-y: auto; padding: 10px 20px 100px; }
  .task-item { background: var(--card); border: 1px solid rgba(255,255,255,0.05); padding: 15px; border-radius: 16px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; transition: 0.2s; }
  .task-item.done { opacity: 0.5; text-decoration: line-through; }
  .task-checkbox { width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--primary); display: flex; justify-content: center; align-items: center; cursor: pointer; flex-shrink: 0; }
  .task-checkbox.checked { background: var(--primary); }
  .task-content { flex: 1; }
  .task-title { font-size: 1rem; margin-bottom: 4px; }
  .task-time { font-size: 0.75rem; color: var(--primary); font-weight: bold; }
  .task-empty { text-align: center; color: var(--text-muted); margin-top: 50px; }

  /* Add Task Modal */
  .fab { position: fixed; bottom: 30px; right: 30px; width: 60px; height: 60px; border-radius: 30px; background: var(--primary); color: #000; font-size: 30px; display: flex; justify-content: center; align-items: center; border: none; box-shadow: 0 4px 15px rgba(56, 189, 248, 0.4); cursor: pointer; z-index: 10; }
  
  .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: flex-end; z-index: 20; }
  .modal.active { display: flex; }
  .modal-content { background: #1e293b; width: 100%; padding: 25px; border-radius: 24px 24px 0 0; border-top: 1px solid rgba(255,255,255,0.1); }
  
  input[type="text"], input[type="time"], select { width: 100%; padding: 15px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); background: rgba(0,0,0,0.2); color: white; font-size: 1rem; margin-bottom: 15px; }
  input[type="text"]:focus, select:focus { outline: none; border-color: var(--primary); }
  
  .modal-actions { display: flex; gap: 10px; margin-top: 10px; }
  .btn { flex: 1; padding: 15px; border-radius: 12px; border: none; font-size: 1rem; font-weight: bold; cursor: pointer; }
  .btn-cancel { background: rgba(255,255,255,0.1); color: white; }
  .btn-save { background: var(--primary); color: #000; }
</style>
</head>
<body>

<div class="header">
  <h1>My Tasks</h1>
  <div class="date-strip" id="dateStrip"></div>
</div>

<div class="task-list" id="taskList">
  <div class="task-empty">No tasks for this day.<br>Tap + to add one.</div>
</div>

<button class="fab" onclick="openModal()">+</button>

<div class="modal" id="taskModal">
  <div class="modal-content">
    <h2 style="margin-bottom: 20px;">New Task</h2>
    
    <!-- This input triggers the Android Keyboard -->
    <input type="text" id="taskTitle" placeholder="Tap here & use Keyboard Mic...">
    
    <input type="time" id="taskTime">
    
    <select id="taskSound">
      <option value="alarm1">Default Alarm Tone (System)</option>
      <option value="alarm2">Digital Beep</option>
      <option value="alarm3">Chime</option>
    </select>
    
    <div class="modal-actions">
      <button class="btn btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveTask()">Save Task</button>
    </div>
  </div>
</div>

<script>
  // --- State ---
  let tasks = JSON.parse(localStorage.getItem('solods_tasks')) || [];
  let selectedDate = new Date().toISOString().split('T')[0];

  // --- Date Strip Logic ---
  function renderDates() {
    const strip = document.getElementById('dateStrip');
    strip.innerHTML = '';
    const days = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
    
    for (let i = 0; i < 7; i++) {
      let d = new Date();
      d.setDate(d.getDate() + i);
      let dateStr = d.toISOString().split('T')[0];
      
      let btn = document.createElement('div');
      btn.className = 'date-btn' + (dateStr === selectedDate ? ' active' : '');
      btn.innerHTML = `<div class="day">${i === 0 ? 'Today' : days[d.getDay()]}</div><div class="num">${d.getDate()}</div>`;
      btn.onclick = () => { selectedDate = dateStr; renderDates(); renderTasks(); };
      strip.appendChild(btn);
    }
  }

  // --- Task Rendering ---
  function renderTasks() {
    const list = document.getElementById('taskList');
    list.innerHTML = '';
    
    let dayTasks = tasks.filter(t => t.date === selectedDate).sort((a, b) => a.time.localeCompare(b.time));
    
    if (dayTasks.length === 0) {
      list.innerHTML = '<div class="task-empty">No tasks for this day.<br>Tap + to add one.</div>';
      return;
    }

    dayTasks.forEach((t, index) => {
      let div = document.createElement('div');
      div.className = 'task-item' + (t.done ? ' done' : '');
      
      let [h, m] = t.time.split(':');
      let ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      let timeStr = `${h}:${m} ${ampm}`;

      div.innerHTML = `
        <div class="task-checkbox ${t.done ? 'checked' : ''}" onclick="toggleTask('${t.id}')"></div>
        <div class="task-content" onclick="toggleTask('${t.id}')">
          <div class="task-title">${t.title}</div>
          <div class="task-time">⏰ ${timeStr}</div>
        </div>
      `;
      list.appendChild(div);
    });
  }

  // --- Actions ---
  function openModal() {
    document.getElementById('taskTitle').value = '';
    let now = new Date();
    now.setMinutes(now.getMinutes() + 30); 
    document.getElementById('taskTime').value = now.toTimeString().slice(0, 5);
    document.getElementById('taskModal').classList.add('active');
    
    // Focus triggers the keyboard automatically
    setTimeout(() => document.getElementById('taskTitle').focus(), 100); 
  }

  function closeModal() {
    document.getElementById('taskModal').classList.remove('active');
  }

  function saveTask() {
    const title = document.getElementById('taskTitle').value.trim();
    const time = document.getElementById('taskTime').value;
    const sound = document.getElementById('taskSound').value;
    if (!title || !time) return alert('Please enter a task and time.');

    tasks.push({
      id: Date.now().toString(),
      title: title,
      time: time,
      date: selectedDate,
      done: false,
      sound: sound // Save the selected sound
    });

    localStorage.setItem('solods_tasks', JSON.stringify(tasks));
    closeModal();
    renderTasks();
    scheduleAlarms();
  }

  function toggleTask(id) {
    let task = tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      localStorage.setItem('solods_tasks', JSON.stringify(tasks));
      renderTasks();
    }
  }

  // --- Alarm Engine ---
  function scheduleAlarms() {
    // Request notification permission
    if (Notification.permission !== 'granted') Notification.requestPermission();
    
    if (window.alarmInterval) clearInterval(window.alarmInterval);
    
    window.alarmInterval = setInterval(() => {
      const now = new Date();
      const currentDate = now.toISOString().split('T')[0];
      const currentTime = now.toTimeString().slice(0, 5);

      tasks.forEach(t => {
        if (t.done || t.date !== currentDate || t.time !== currentTime) return;
        if (t.lastAlarmed === currentTime) return; // Prevent double alarm
        
        // --- THE ALARM FIRES ---
        
        // 1. Show Native Notification (This uses the phone's default notification sound!)
        if (Notification.permission === 'granted') {
          new Notification('Task Reminder', {
            body: t.title,
            icon: 'https://cdn-icons-png.flaticon.com/512/1008/1008011.png',
            vibrate: [500, 110, 500, 110, 450, 110, 200, 110, 170, 40, 450, 110, 200, 110, 170, 40, 500]
          });
        }

        // 2. Play the chosen sound in-app (Fallback if app is open)
        playAlarmSound(t.sound);

        // Mark as alarmed
        t.lastAlarmed = currentTime;
        localStorage.setItem('solods_tasks', JSON.stringify(tasks));
      });
    }, 10000);
  }

  // --- Sound Player ---
  let currentAudio = null;
  function playAlarmSound(soundId) {
    if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }

    // If user selected "System Default", we trigger a native vibration & rely on the Notification sound
    if (soundId === 'alarm1') {
       if (navigator.vibrate) navigator.vibrate([1000, 500, 1000, 500, 1000]);
       return; 
    }

    // Otherwise, play our fallback web sounds
    let url = '';
    if (soundId === 'alarm2') url = 'https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg';
    if (soundId === 'alarm3') url = 'https://actions.google.com/sounds/v1/alarms/beep_short.ogg';

    if (url) {
      currentAudio = new Audio(url);
      currentAudio.loop = true;
      currentAudio.play().catch(e => console.log("Audio blocked", e));
      
      // Auto stop after 30 seconds
      setTimeout(() => {
        if (currentAudio) { currentAudio.pause(); currentAudio.currentTime = 0; }
      }, 30000);
    }
  }

  renderDates();
  renderTasks();
  scheduleAlarms();
</script>
</body>
</html>
