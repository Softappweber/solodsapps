name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Use v4.0.4 — v4.0.0–v4.0.1 can fail on missing "tools" package
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4.0.4

      # Debug: show what actually got checked out
      - name: Verify project structure
        run: |
          echo "--- Current directory ---"
          pwd
          echo "--- Top-level files ---"
          ls -la
          echo "--- Looking for android/gradlew ---"
          ls -la android/gradlew || echo "ERROR: android/gradlew not found!"

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
